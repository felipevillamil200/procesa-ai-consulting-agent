services:
  - type: web
    name: procesa-ai-consulting-agent
    runtime: python
    buildCommand: "npm --prefix codigo/frontend install && npm --prefix codigo/frontend run build && pip install -r requirements.txt"
    startCommand: "python -m uvicorn codigo.backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
